  apiServer: "54.66.164.194.sslip.io/k8s/clusters/local"
  replicaCount: 1
  pullPolicy: "IfNotPresent"
  resources: {}
  image:
    repository: cnrancher/mirrored-submariner-lighthouse-agent
    tag: 0.22.0
lighthouseCoredns:
  resources: {}
  replicaCount: 1
  image:
    repository: cnrancher/mirrored-submariner-lighthouse-coredns
    tag: 0.22.0
    pullPolicy: "IfNotPresent"
# Multi-cluster service configuration
mcs:
  # Enable automatic CIDR detection for custom clusters
  autoDetectCIDR: true
  # Default cluster CIDR (used when auto-detection fails)
  defaultClusterCIDR: "10.110.0.0/16"
  # Default service CIDR (used when auto-detection fails)
  defaultServiceCIDR: "10.111.0.0/16"
  # Enable ServiceCIDR routing
  enableServiceCIDRRouting: false
# Controller configuration
controller:
  resources: {}
  replicaCount: 1
  image:
    repository: cnrancher/mcs-addon-controller
    tag: v0.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 443
# Scheduling configuration
scheduling:
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: cattle.io/os
      operator: "Equal"
      value: "linux"
      effect: NoSchedule
  affinity: {}
# Global configuration
global:
  cattle:
    systemDefaultRegistry: "registry.rancher.cn"
    provisioningNamespace: "fleet-default"
